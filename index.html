<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kryssordbok</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Material Design Lite -->
    <script type="text/javascript" src="/assets/js/material.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/material.brown-amber.min.css" />

    <link rel="stylesheet" href="stylesheet.css" />
  </head>

  <body>
    <div class="centered">
      <div id="top-banner" role="banner">
        <button
          id="show-dialog"
          style="margin: 10px; float: right"
          class="mdl-button mdl-js-button mdl-button--fab mdl-button--mini-fab"
        >
          <i class="material-icons">help</i>
        </button>
      </div>

      <div id="info" class="mdl-dialog mdl-card mdl-shadow--2dp">
        <!--<dialog class="mdl-dialog">-->
        <!--Bad cross-platform support for dialogs-->
        <h4 class="mdl-dialog__title">Kryssordbok for mobil</h4>
        <div class="mdl-dialog__content">
          <p>
            Laget for moro skyld. All funksjonalitet knyttet til &#xE5; finne
            ord krediteres <a href="//kryssord.org">kryssord.org</a>
          </p>
          <p>
            Bruk
            <button class="plain mdl-button--raised">
              <i style="font-size: 1em" class="material-icons">crop_din</i>
            </button>
            for &#xE5; sette inn jokertegn for en enkelt bokstav og
            <button style class="plain mdl-button--raised">
              <i style="font-size: 1em" class="material-icons">more_horiz</i>
            </button>
            for &#xE5; sette inn jokertegn for ubestemt antall bokstaver.
          </p>
        </div>
        <div class="mdl-dialog__actions">
          <!-- <button type="button" class="mdl-button">Agree</button> -->
          <button type="button" class="mdl-button close">Lukk</button>
        </div>
        <!--</dialog>-->
      </div>

      <form
        role="main"
        action="#"
        onsubmit="
          searchSynonyms();
          return false;
        "
      >
        <div
          class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label"
        >
          <input
            class="mdl-textfield__input"
            type="search"
            required
            id="sokeord"
          />
          <label class="mdl-textfield__label" for="sokeord"
            >Sp&#xF8;rreord</label
          >
        </div>
        <br />
        <div
          class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label"
        >
          <input class="mdl-textfield__input" type="search" id="losning" />
          <label class="mdl-textfield__label" for="losning"
            >L&#xF8;sningsord</label
          >
        </div>
        <br />
        <!-- Raised button with ripple -->
        <button
          class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect"
          onclick="addWildcard('?')"
          type="button"
        >
          <i class="material-icons">crop_din</i>
        </button>
        <button
          class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect"
          onclick="addWildcard('*')"
          type="button"
        >
          <i class="material-icons">more_horiz</i>
        </button>
        <button
          style="font-weight: bold"
          class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect"
          type="submit"
          id="soksynonymer"
        >
          S&#xF8;k
        </button>
      </form>
      <br />
      <div id="overlay">
        <div
          style="top: 50%"
          class="mdl-spinner mdl-js-spinner is-active"
        ></div>
      </div>
      <table class="mdl-data-table" id="output">
        <!--Table for search results-->
      </table>
    </div>

    <!-- Top overlay illustrative -->
    <header role="figure">
      <table class="tiles" style="margin-left: auto; margin-right: auto">
        <tbody>
          <tr id="tilerow">
            <!-- Container for crossword tiles -->
          </tr>
        </tbody>
      </table>
    </header>

    <!-- Scripts -->
    <script type="text/javascript" src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").then(function () {
          console.log("Service worker registered");
        });
      }
    </script>
  </body>
</html>
