[project]
name = "kryssord-tui"
version = "0.1.0"
description = "Terminal crossword-solving helper backed by kryssord.org"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "requests-cache>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
